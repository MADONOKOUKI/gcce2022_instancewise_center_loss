# Example config for `python train.py --config configs/example.yaml`.
# Keys are train.py argument names (dashes or underscores); command-line flags override them.
# These values are one setting of Table I of the paper: WideResNet-28-10, Cutout, CIFAR-100,
# instance-wise center loss with N = 2 views and lambda_IC = 0.5 (the train.py defaults).
dataset: cifar100
model: wideresnet
augmentation: cutout
method: proposed
num_views: 2
lambda_ic: 0.5
distance: mse
epochs: 200
batch_size: 256
lr: 0.1
weight_decay: 0.0005
milestones: [60, 120, 180]
data_root: ./data
seed: 1
